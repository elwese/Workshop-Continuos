name: CI
on:
  pull_request:
    branches:
      - main
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  
      - name: Install dependencies
        run: pip install pytest pylint
      - name: Run tests
        run: pytest
      - name: Lint with pylint
        run: pylint $(git ls-files '*.py') 